[project]
name = "sigint_examples"
version = "0.2.0"
description = "Python SIGINT simulations and analysis tools"
authors = [
    { name = "Jackson Walters", email = "jackson@jacksonwalters.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/walters-labs/sigint-examples"

[project.scripts]
sigint-workflow = "sigint_examples.basic_workflow:main"
sigint = "sigint_examples.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sigint_examples*"]
